model_list:
  # Wildcard passthrough keeps ChefMind from having to update this file
  # for every new provider model revision. LiteLLM still calculates spend
  # using its maintained pricing catalog.
  - model_name: "*"
    litellm_params:
      model: "*"

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
